<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Coding Enhanced Web</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --ok: #3fb950; --accent: #2f81f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(680px, calc(100vw - 32px)); }
    h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
    .sub { margin: 0 0 22px; color: var(--muted); }
    .card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .row:first-child { border-top: 0; }
    .row span { color: var(--muted); }
    .row strong { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
    .ok { color: var(--ok); }
    .hint { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>DSH Coding Enhanced Web</h1>
    <p class="sub">Standalone review server · W1a skeleton</p>
    <div class="card">
      <div class="row"><span>Status</span><strong id="status">checking…</strong></div>
      <div class="row"><span>Version</span><strong id="version">—</strong></div>
      <div class="row"><span>RP ID / origin</span><strong id="rp">—</strong></div>
      <div class="row"><span>Online devices</span><strong id="devices">—</strong></div>
    </div>
    <p class="hint">The React review UI (passkey login, pairing, diff, decisions) lands in W1b. This page only verifies that the server, SQLite and passkey config are alive.</p>
  </main>
  <script>
    const el = (id) => document.getElementById(id)
    fetch('/api/health')
      .then((response) => response.json())
      .then((data) => {
        el('status').textContent = data.ok ? 'ok' : 'error'
        el('status').className = data.ok ? 'ok' : ''
        el('version').textContent = data.version ?? '—'
        el('rp').textContent = `${data.rpID ?? '—'} · ${data.origin ?? '—'}`
        el('devices').textContent = String(data.onlineDevices ?? 0)
      })
      .catch(() => {
        el('status').textContent = 'offline'
      })
  </script>
</body>
</html>
